<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css"
        type="text/css" />
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
    <script type='text/javascript'>
        var map;

        function init() {
            fetch("https://<storage_name>.blob.core.windows.net/gps-data/?restype=container&comp=list")
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(xml => {
                    let blobList = Array.from(xml.querySelectorAll("Url"));
                    return Promise.all(blobList.map(blobUrl => loadJSON(blobUrl.textContent)));
                })
                .then(features => {
                    map = new atlas.Map('myMap', {
                        center: [-122.26473, 47.73444],
                        zoom: 14,
                        authOptions: {
                            authType: "subscriptionKey",
                            subscriptionKey: "<subscription_key>"
                        }
                    });
                    map.events.add('ready', function () {
                        var source = new atlas.source.DataSource();
                        map.sources.add(source);
                        map.layers.add(new atlas.layer.BubbleLayer(source));
                        source.add(features);
                    });
                });
        }

        function loadJSON(file) {
            return fetch(file)
                .then(response => response.json())
                .then(gps => new atlas.data.Feature(
                    new atlas.data.Point([parseFloat(gps.gps.lon), parseFloat(gps.gps.lat)])
                ));
        }
    </script>
    <style>
        html,
        body,
        #myMap {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body onload="init()">
    <div id="myMap"></div>
</body>

</html>
